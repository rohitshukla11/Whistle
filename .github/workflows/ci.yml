name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-runtime:
    name: forge test + TypeScript tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: forge build
        working-directory: contracts
        run: forge build

      # No SEPOLIA_RPC_URL here: the Sepolia fork tests skip themselves, the rest run in full.
      - run: pnpm test:all

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      # No RPC variables: the build vendors the committed deployments and skips on-chain checks.
      - run: pnpm build
        working-directory: web
